<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Not found — Bullpen Works</title><style>
:root {
  --paper:#F7F7F5; --sheet:#FFFFFF; --ink:#232A2E; --muted:#5F6B70;
  --accent:#C25E00; --accent-ink:#FFFFFF; --accent-soft:#F4E3D3;
  --steel:#3B5A73; --steel-soft:#E3EAF0; --line:#DCE0DE;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#15191C; --sheet:#1C2226; --ink:#E5E8E6; --muted:#98A3A7;
    --accent:#F0913A; --accent-ink:#1A1108; --accent-soft:#3A2A1A;
    --steel:#85ACC7; --steel-soft:#232E37; --line:#2B3338;
  }
}
:root[data-theme="dark"] {
  --paper:#15191C; --sheet:#1C2226; --ink:#E5E8E6; --muted:#98A3A7;
  --accent:#F0913A; --accent-ink:#1A1108; --accent-soft:#3A2A1A;
  --steel:#85ACC7; --steel-soft:#232E37; --line:#2B3338;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Helvetica Neue",system-ui,sans-serif;
  font-size:17px;line-height:1.6}
.condensed{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
  text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.wrap{max-width:1020px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:10}
.topbar{display:flex;align-items:center;gap:18px;padding:14px 0;flex-wrap:wrap}
.wordmark{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-size:19px;color:var(--ink);text-decoration:none}
.wordmark span{color:var(--accent)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{color:var(--muted);text-decoration:none;font-size:14.5px;padding:6px 10px;border-radius:6px}
nav.main a:hover{background:var(--steel-soft);color:var(--ink)}
nav.main a.active{color:var(--accent);font-weight:600}
nav.main a.navcta{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hero{padding:64px 0 46px}
.hero h1{font-size:clamp(34px,5.5vw,56px);line-height:1.04;margin:0 0 16px;max-width:17ch;text-wrap:balance}
.hero .subhead{font-size:19px;color:var(--muted);max-width:56ch;margin:0 0 26px}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:16px;
  padding:13px 22px;border-radius:8px;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--sheet)}
.ctarow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ctarow-center{justify-content:center}
section.band{padding:46px 0;border-top:1px solid var(--line)}
h2.sec{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;text-transform:uppercase;
  letter-spacing:.05em;font-weight:700;font-size:28px;margin:0 0 20px;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:-8px 0 24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stat{background:var(--sheet);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:10px;padding:20px 22px}
.stat .big{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:700;
  font-size:30px;line-height:1.1;margin-bottom:8px;font-variant-numeric:tabular-nums}
.stat p{margin:0;color:var(--muted);font-size:15px}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:14px}
ol.steps li{counter-increment:s;background:var(--sheet);border:1px solid var(--line);
  border-radius:10px;padding:18px 20px 18px 66px;position:relative;max-width:72ch}
ol.steps li::before{content:counter(s);position:absolute;left:20px;top:16px;
  font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:24px;
  color:var(--accent);width:30px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px}
.faq{display:grid;gap:10px;max-width:76ch}
details.qa{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:0}
details.qa summary{cursor:pointer;font-weight:600;padding:16px 20px;list-style:none}
details.qa summary::before{content:"+";color:var(--accent);font-weight:700;margin-right:10px}
details.qa[open] summary::before{content:"–"}
details.qa p{margin:0;padding:0 20px 16px 40px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.pricing{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.pricing th{text-align:left;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
  text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--muted);
  border-bottom:2px solid var(--ink);padding:8px 14px 8px 0}
table.pricing td{border-bottom:1px solid var(--line);padding:12px 14px 12px 0;vertical-align:top;font-size:15.5px}
.tier-cta{display:inline-block;margin-top:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
.pricenote{color:var(--muted);font-size:14.5px;margin-top:14px}
.finalband{background:var(--accent-soft);border-top:1px solid var(--line);padding:56px 0;text-align:center}
.finalband h2{font-size:clamp(26px,4vw,38px);margin:0 0 22px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:14px}
footer .frow{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--steel)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.hero{padding:44px 0 36px}}
</style></head><body><div class="wrap hero"><h1 class="condensed">Wrong extension.</h1><p class="subhead">That page isn't here — but we still answer. </p><a class="btn btn-primary" href="/">Back to Bullpen Works</a></div></body></html>
